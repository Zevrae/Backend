# Nginx reverse-proxy config for api.zevrae.com — addresses the issues
# found while debugging /api/tryon in production:
#
# 1. 502 Bad Gateway (timeout mismatch) — LARGELY RESOLVED BY AN
#    ARCHITECTURE CHANGE, not just this config: /api/tryon now starts a
#    background job and responds in ~1-2s instead of holding the
#    connection open for the full 25-40s+ generation time (see
#    tryonController.js — POST returns 202 immediately, the frontend polls
#    GET /api/tryon/:id/status). So no proxy timeout tuning can "fully"
#    fix a long synchronous request problem — removing the long
#    synchronous request does. The timeouts below are still worth keeping
#    generous as a safety margin, just not the critical lever they used to be.
#
# 2. 422 Unprocessable Entity on some requests
#    A request with valid multipart file uploads that still 422s at FastAPI
#    almost always means the multipart body/boundary arrived corrupted or
#    truncated by the time it reached FastAPI — most commonly caused by
#    `client_max_body_size` being smaller than the actual upload (Nginx's
#    default is a stingy 1MB) silently truncating the body, or a proxy in
#    front of this one rewriting the Content-Type header and dropping the
#    multipart boundary. Fixed below by raising client_max_body_size and
#    explicitly NOT touching Content-Type.
#
# 3. net::ERR_CERT_AUTHORITY_INVALID
#    This is a certificate problem, not something an Nginx *proxy* config
#    can fix — it means whatever TLS certificate is being presented for
#    this domain isn't signed by a trusted CA (self-signed, expired, or a
#    mismatched domain). If TRYON_SERVICE_URL in the Node backend's .env
#    points at an internal https:// address with a self-signed cert, axios
#    will reject the handshake by default and every request will fail
#    before it even reaches this Nginx config — check that URL first. If
#    it's api.zevrae.com itself that's showing the invalid-cert warning in
#    the browser, get/renew a real certificate (e.g. via certbot/Let's
#    Encrypt) — don't disable certificate verification anywhere as a
#    workaround, that just trades a visible error for a silent security
#    hole.
#
# 4. ETIMEDOUT between the Node backend and the Python microservice
#    This is an internal service-to-service call — it does NOT go through
#    this Nginx config at all (assuming the two services talk to each
#    other directly/over an internal network), so nothing here affects it.
#    See GEMINI_TIMEOUT_SECONDS in Tryon-main's own .env and
#    TRYON_SERVICE_TIMEOUT_MS in this backend's .env instead.

upstream tryon_backend {
    server 127.0.0.1:5000;  # the Node/Express backend (Backend-main), NOT the Python microservice directly
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name api.zevrae.com;

    ssl_certificate     /etc/letsencrypt/live/api.zevrae.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zevrae.com/privkey.pem;

    # Large enough for a person photo + up to 5 garment photos at 5MB each
    # (see MAX_TRYON_CLOTH_IMAGES / uploadTryonImages in middleware/upload.js).
    # Nginx's default here is 1MB, which silently truncates anything bigger —
    # a very plausible cause of the 422s, since a truncated multipart body
    # is a malformed one.
    client_max_body_size 40m;

    location /api/tryon {
        proxy_pass http://tryon_backend;

        # `always` makes these apply even to error responses (502, 504,
        # etc). Without it, a genuine upstream failure comes back with NO
        # CORS headers at all, and the browser reports it as "blocked by
        # CORS policy" instead of showing the real error — which is
        # exactly what was observed in production and is the single
        # biggest reason this is worth having even though app.use(cors())
        # in Express already handles the success case.
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Generous but no longer the critical constraint it was — POST
        # /api/tryon itself now responds in ~1-2s (see note #1 above).
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;

        # Required for multipart uploads to survive the proxy hop intact —
        # do NOT set/override Content-Type here, it carries the multipart
        # boundary the client generated. Rewriting or dropping it is what
        # turns a valid upload into a 422.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_request_buffering off; # stream the body through rather than buffering the whole thing first
    }

    location / {
        proxy_pass http://tryon_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
